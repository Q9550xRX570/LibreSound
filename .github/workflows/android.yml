name: Android CI & Preview APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_all_abis:
        description: "Build all ABIs + universal APK for full preview"
        required: false
        type: boolean
        default: false

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and lint
        run: ./gradlew :core:dsp:test :app:testLiteDebugUnitTest :app:testFullDebugUnitTest :app:lintLiteDebug :app:lintFullDebug

  build-preview-apks:
    needs: test-and-lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Lite Preview APK
        run: ./gradlew :app:assembleLitePreview

      - name: Assemble Full Preview APK
        run: |
          if [ "${{ inputs.include_all_abis }}" = "true" ]; then
            ./gradlew :app:assembleFullPreview
          else
            ./gradlew :app:assembleFullPreview -Plibreopus.previewArm64Only=true
          fi

      - name: Upload Lite Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreOpus-Lite-Preview
          path: app/build/outputs/apk/lite/preview/*.apk
          if-no-files-found: error

      - name: Upload Full ARM64 Preview APK
        if: inputs.include_all_abis != true
        uses: actions/upload-artifact@v4
        with:
          name: LibreOpus-Full-ARM64-Preview
          path: app/build/outputs/apk/full/preview/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload Full Multi-ABI Preview APKs
        if: inputs.include_all_abis == true
        uses: actions/upload-artifact@v4
        with:
          name: LibreOpus-Full-All-ABIs-Preview
          path: app/build/outputs/apk/full/preview/*.apk
          if-no-files-found: error
